services:
  logiksmith:
    build:
      context: .
      args:
        # Empty means the full desktop feature set. For a stripped image use,
        # for example, LOGIKSMITH_FEATURES=webhook-inputs.
        LOGIKSMITH_FEATURES: ${LOGIKSMITH_FEATURES:-}
    image: logiksmith:local
    restart: unless-stopped
    # The image is immutable; only the mounted automation/config directory is
    # writable. Docker remains the process supervisor for fatal host failures.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "${LOGIKSMITH_WEB_PORT:-8080}:8080"
    volumes:
      - "${LOGIKSMITH_CONFIG_DIR:-./config}:/config"
    environment:
      LOGIKSMITH_RUNTIME_PROFILE: ${LOGIKSMITH_RUNTIME_PROFILE:-desktop}
      LOGIKSMITH_CONFIG_PATH: /config/local.toml
      LOGIKSMITH_AUTOMATION_PATH: /config/automation.toml
      RUST_LOG: ${RUST_LOG:-info}
      # Put source credentials in the environment or a Docker secret. Do not
      # commit them to the mounted TOML files.
      WEATHER_API_TOKEN: ${WEATHER_API_TOKEN:-}
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
