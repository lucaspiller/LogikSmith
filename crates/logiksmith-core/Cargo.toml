[package]
name = "logiksmith-core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = ["timezones", "astronomy"]
timezones = ["jiff/tzdb-bundle-always"]
astronomy = []
http-inputs = []
webhook-inputs = []
external-inputs = ["http-inputs", "webhook-inputs"]

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
