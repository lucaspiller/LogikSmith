[workspace]
members = ["crates/*"]
resolver = "3"

[patch.crates-io]
# lua-src's published target switch rejects Xtensa even though Lua's C sources
# build cleanly with the ESP32 newlib toolchain. Keep the patch local so the
# embedded profile uses the same Lua 5.4 sources as desktop.
lua-src = { path = "crates/logiksmith-embedded-abi/vendor/lua-src" }
