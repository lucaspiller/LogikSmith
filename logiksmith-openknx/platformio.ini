[platformio]
default_envs = release_LogikSmith_REG1_LAN_TP_Base

[env]
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain
board = esp32dev
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board_build.filesystem = littlefs
board_build.partitions = partitions/esp32_8mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
lib_deps =
    https://github.com/OpenKNX/knx.git#8e4c5bc5c55bc7bc07711992d7794478f3e40797
    https://github.com/OpenKNX/OGM-Common.git#66bc4afdee4cc3160f59a1145abee0235b2e64fb
    https://github.com/OpenKNX/OGM-HardwareConfig.git#1100b7099341b8209025a5e3e815f2e08f9bb837
build_flags =
    -D OPENKNX
    -D NCN5120
    -D KNX_FLASH_CALLBACK
    -D SMALL_GROUPOBJECT
    -D USE_BINSEARCH
    -D KNX_ACTIVITYCALLBACK
    -D MASK_VERSION=0x07B0
    -D DEVICE_REG1_LAN_TP_BASE
    -D LOGIKSMITH_OPENKNX_DEVICE
    -D SERIAL_DEBUG=Serial
    -I include
    -I ../crates/logiksmith-embedded-abi/include
    -I .pio/libdeps/${PIOENV}/OGM-HardwareConfig/include
    -Wuninitialized
    -Wunused-variable
    -Wno-unknown-pragmas
    -Wno-switch
extra_scripts =
    pre:scripts/apply_knx_raw_patch.py
    pre:scripts/build_rust.py
    post:scripts/verify_runtime_link.py

[env:release_LogikSmith_REG1_LAN_TP_Base]
build_type = release
build_flags =
    ${env.build_flags}
    -D OPENKNX_WATCHDOG
    -D LOGIKSMITH_REQUIRE_ABI_RUNTIME
